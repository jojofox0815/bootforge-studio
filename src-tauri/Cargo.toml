[package]
name = "bootforge-studio"
version = "0.1.0"
description = "Trusted host runtime for BootForge Studio"
edition = "2021"
build = "build.rs"

[lib]
name = "bootforge_core"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
