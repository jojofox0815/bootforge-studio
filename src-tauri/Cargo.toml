[package]
name = "bootforge-studio"
version = "0.1.0"
description = "Trusted host runtime for BootForge Studio"
edition = "2021"

[lib]
name = "bootforge_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

# Tauri wiring is enabled when the desktop host is built in the next milestone.
# Keeping the domain crate UI-independent makes it testable without a windowing runtime.
