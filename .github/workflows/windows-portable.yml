name: Build portable Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-portable.yml"
      - "app/globals.css"
      - "components/**"
      - "desktop/**"
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "postcss.config.mjs"
      - "vite.desktop.config.ts"

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Windows x64 portable
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Build portable executable
        run: npx tauri build --no-bundle --target x86_64-pc-windows-msvc

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "src-tauri/target/x86_64-pc-windows-msvc/release/bootforge-studio.exe" "artifacts/BootForge-Studio-Portable-x64.exe"

      - name: Authenticode sign when certificate secrets exist
        id: sign
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "No Authenticode certificate configured; publishing an unsigned artifact."
            exit 0
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "bootforge-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match "\\x64\\signtool.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe was not found" }

          & $signtool.FullName sign /f $pfxPath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com "artifacts/BootForge-Studio-Portable-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed" }
          & $signtool.FullName verify /pa /v "artifacts/BootForge-Studio-Portable-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed" }
          Remove-Item $pfxPath -Force
          "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Write build metadata
        shell: pwsh
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          $metadata = @{
            product = "BootForge Studio"
            version = "0.1.0"
            architecture = "x86_64"
            portable = $true
            signed = ($env:SIGNED -eq "true")
            commit = "${{ github.sha }}"
          }
          $metadata | ConvertTo-Json | Set-Content "artifacts/build-metadata.json"

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: BootForge-Studio-Windows-x64-${{ steps.sign.outputs.signed == 'true' && 'signed' || 'unsigned' }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
